name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 快速门禁：类型检查 + 单元测试（纯逻辑，无需原生模块编译）。
  # 通过后再进入耗时的三平台打包，避免把明显错误带到打包阶段。
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 纯逻辑测试与 tsc 不依赖原生绑定，--ignore-scripts 跳过 sqlite3/uiohook 编译，快且稳。
      - name: Install dependencies (no native build)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal：在 arm64 runner 上一次产出 Intel(x64)+Apple Silicon(arm64) 双架构 DMG，
          # 规避 macOS-13(Intel) runner 在免费额度下长期排队的问题。
          - os: macos-latest
            arch: universal
            target: mac
            flags: --universal
          - os: windows-latest
            arch: x64
            target: win
            flags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native build; electron-builder 会针对 Electron ABI 处理原生依赖)
        run: npm ci --ignore-scripts

      # --publish never：electron-builder 自带的 publisher 会和多 runner 抢同一个 release，
      # 这里只让它把产物写到 release/（build.directories.output），上传交给 publish job。
      # 从 npmmirror 拉 Electron 二进制/构建工具，规避 GitHub Release 资产偶发 504。
      # electron-builder 下载偶发 504/网关超时 → 指数退避重试最多 4 次。
      - name: Build & package (${{ matrix.target }} ${{ matrix.arch }})
        shell: bash
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: |
          attempt=0
          delay=20
          until npm run dist:${{ matrix.target }} -- --publish never ${{ matrix.flags }}; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then echo "::error::打包连续失败 4 次"; exit 1; fi
            echo "::warning::第 $attempt 次尝试失败，${delay}s 后重试"
            sleep "$delay"
            delay=$((delay * 2))
          done

      - name: List artifacts
        shell: bash
        run: |
          ls -lh release/ 2>/dev/null || true
          find release -maxdepth 1 -type f | sort

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    # 手动触发（workflow_dispatch）不发布，避免覆盖既有 release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true

      - name: Check artifacts
        shell: bash
        run: |
          ls -lh artifacts
          n=$(find artifacts -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) | wc -l | tr -d ' ')
          echo "installer files: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::没有构建产物，终止发布（检查上面 build 日志）"
            exit 1
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # latest.yml / latest-mac.yml 也要传，否则自动更新取不到新版本
          fail_on_unmatched_files: true
          generate_release_notes: true
