name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
            target: mac
          - os: macos-14
            arch: arm64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & package (${{ matrix.target }})
        run: npm run dist:${{ matrix.target }}
        env:
          # 仅触发 tag 时上传；手动触发不覆盖既有 release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        shell: bash
        run: |
          ls -lh release/ 2>/dev/null || true
          find dist -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) 2>/dev/null

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.arch == 'x64' && matrix.target == 'mac'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.exe
          generate_release_notes: true