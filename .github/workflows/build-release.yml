name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
            target: mac
          - os: macos-14
            arch: arm64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never：electron-builder 自带的 publisher 会和多 runner 抢同一个 release，
      # 这里只让它把产物写到 release/（build.directories.output），上传交给 publish job。
      # npm run xxx -- 之后的参数会追加给 electron-builder。
      - name: Build & package (${{ matrix.target }} ${{ matrix.arch }})
        run: npm run dist:${{ matrix.target }} -- --publish never

      - name: List artifacts
        shell: bash
        run: |
          ls -lh release/ 2>/dev/null || true
          find release -maxdepth 1 -type f | sort

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    # 手动触发（workflow_dispatch）不发布，避免覆盖既有 release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true

      - name: Check artifacts
        shell: bash
        run: |
          ls -lh artifacts
          n=$(find artifacts -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) | wc -l | tr -d ' ')
          echo "installer files: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::没有构建产物，终止发布（检查上面 build 日志）"
            exit 1
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # latest.yml / latest-mac.yml 也要传，否则自动更新取不到新版本
          fail_on_unmatched_files: true
          generate_release_notes: true
